name: seisei_workspace
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"

workspace:
  - packages/seisei
  - packages/seisei_test
  - packages/seisei_apple
  - packages/seisei_intents
  - packages/seisei_flutter
  - packages/seisei_openai
  - packages/seisei_generator
  - packages/discontinued/seisei_schema
  - packages/discontinued/seisei_router
  - packages/discontinued/seisei_flutter_intents
  - packages/discontinued/seisei_ui
  - packages/discontinued/seisei_tagflow
  - examples/basic_cli
  - examples/chat

dev_dependencies:
  very_good_analysis: ^10.2.0

# TagflowMarkdownStream (devaryakjha/tagflow#94) is on tagflow main but not
# published yet. Remove this override once a tagflow release ships it.
dependency_overrides:
  tagflow:
    git:
      url: https://github.com/devaryakjha/tagflow.git
      ref: ee31e5631d114d51999fbce009d89b3551dfa178
      path: packages/tagflow
