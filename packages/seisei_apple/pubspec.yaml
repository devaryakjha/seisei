name: seisei_apple
description: Apple Foundation Models provider and Flutter bridge for Seisei.
version: 0.3.0-dev.0
repository: https://github.com/devaryakjha/seisei
issue_tracker: https://github.com/devaryakjha/seisei/issues
topics:
  - ai
  - apple
  - dart
  - foundation-models
  - on-device

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  seisei: ^0.3.0-dev.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  seisei_test: ^0.3.0-dev.0
  test: ^1.26.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SeiseiApplePlugin
        sharedDarwinSource: true
      macos:
        pluginClass: SeiseiApplePlugin
        sharedDarwinSource: true
