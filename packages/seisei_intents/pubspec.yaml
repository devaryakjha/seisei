name: seisei_intents
description: App action contracts, a Flutter runtime bridge, and an App Intents generator for Seisei tools.
version: 0.2.0-dev.0
repository: https://github.com/devaryakjha/seisei
issue_tracker: https://github.com/devaryakjha/seisei/issues
topics:
  - ai
  - dart
  - intents
  - tool-calling
  - app-actions

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.3.0"
resolution: workspace

executables:
  generate_apple_intents:

dependencies:
  flutter:
    sdk: flutter
  seisei: ^0.2.0-dev.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.26.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SeiseiFlutterIntentsPlugin
      macos:
        pluginClass: SeiseiFlutterIntentsPlugin
