name: seisei_chat
description: Flutter chat example for Seisei, with answers streamed through Tagflow.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  seisei: ^0.3.0-dev.0
  seisei_apple: ^0.3.0-dev.0
  seisei_flutter: ^0.3.0-dev.0
  seisei_intents: ^0.3.0-dev.0
  seisei_openai: ^0.3.0-dev.0
  tagflow: ^1.0.0-beta.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  http: ^1.2.0
  seisei_test: ^0.3.0-dev.0
  test: ^1.26.0

flutter:
  uses-material-design: true
